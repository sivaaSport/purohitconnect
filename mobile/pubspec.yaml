name: purohit_mobile
description: "PurohitConnect - Premium Vedic Ceremonies & Purohit Booking Mobile App (iOS & Android)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  intl: ^0.19.0
  provider: ^6.1.1
  razorpay_flutter: ^1.4.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: AppSans
      fonts:
        - asset: assets/fonts/AppSans-Regular.ttf
        - asset: assets/fonts/AppSans-Bold.ttf
          weight: 700

