{% extends 'base.html' %}

{% block title %}Verify Phone | PurohitConnect{% endblock %}

{% block extra_head %}
<style>
    .phone-input {
        position: relative;
    }
    .phone-input input {
        padding-left: 3rem;
    }
    .phone-prefix {
        position: absolute;
        left: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--color-text-muted);
        font-weight: 500;
        pointer-events: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="container auth-shell" style="padding: var(--spacing-2xl) var(--spacing-md); display: flex; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 450px; padding: var(--spacing-xl);">
        <div style="text-align: center; margin-bottom: var(--spacing-xl);">
            <div style="width: 64px; height: 64px; background: rgba(16, 185, 129, 0.14); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto var(--spacing-md); color: #10b981;">
                <i data-lucide="phone" style="width: 32px; height: 32px;"></i>
            </div>
            <h1 style="margin-bottom: 0.5rem; font-size: 1.8rem;">Verify Your Phone</h1>
            <p style="color: var(--color-text-muted);">Add a phone number to secure your account</p>
        </div>

        <form method="POST" action="{% url 'accounts:verify_phone' %}">
            {% csrf_token %}
            
            <div style="margin-bottom: var(--spacing-lg);">
                <label style="display: block; font-weight: 500; margin-bottom: var(--spacing-sm);">Phone Number</label>
                <div class="phone-input">
                    <span class="phone-prefix">+91</span>
                    <input type="tel" name="phone" required placeholder="9876543210" 
                           pattern="[6-9][0-9]{9}" maxlength="10"
                           style="width: 100%; padding: 0.75rem; padding-left: 3rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-family: var(--font-body);">
                </div>
                <small style="color: var(--color-text-muted); font-size: 0.8rem;">Enter 10-digit mobile number</small>
            </div>
            
            <button type="submit" 
                    style="width: 100%; padding: 0.875rem; background: var(--color-primary); color: white; border: none; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; transition: transform 0.2s;"
                    onmouseover="this.style.transform='translateY(-1px)'"
                    onmouseout="this.style.transform='translateY(0)'">
                Send Verification Code
            </button>
        </form>

        <div style="text-align: center; margin-top: var(--spacing-lg); padding-top: var(--spacing-lg); border-top: 1px solid var(--color-border);">
            <a href="{% if user.role == 'purohit' %}{% url 'dashboard:purohit' %}{% else %}{% url 'dashboard:customer' %}{% endif %}" 
               style="color: var(--color-text-muted); text-decoration: none; font-weight: 500;">
                Skip for now
            </a>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const phoneInput = document.querySelector('input[name="phone"]');
    
    phoneInput.addEventListener('input', function(e) {
        // Remove any non-digit characters
        this.value = this.value.replace(/\D/g, '');
        
        // Limit to 10 digits
        if (this.value.length > 10) {
            this.value = this.value.slice(0, 10);
        }
    });
});
</script>
{% endblock %}
