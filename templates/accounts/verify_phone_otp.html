{% extends 'base.html' %}

{% block title %}Verify Phone OTP | PurohitConnect{% endblock %}

{% block extra_head %}
<style>
    .otp-inputs {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        margin: var(--spacing-lg) 0;
    }
    .otp-input {
        width: 3rem;
        height: 3rem;
        text-align: center;
        font-size: 1.5rem;
        font-weight: 600;
        border: 2px solid var(--color-border);
        border-radius: var(--radius-md);
        background: var(--color-bg-main);
        color: var(--color-text-main);
        transition: all 0.2s;
    }
    .otp-input:focus {
        border-color: var(--color-primary);
        outline: none;
        box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.1);
    }
    .timer {
        font-size: 0.9rem;
        color: var(--color-text-muted);
        text-align: center;
        margin-bottom: var(--spacing-md);
    }
</style>
{% endblock %}

{% block content %}
<div class="container auth-shell" style="padding: var(--spacing-2xl) var(--spacing-md); display: flex; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 450px; padding: var(--spacing-xl);">
        <div style="text-align: center; margin-bottom: var(--spacing-xl);">
            <div style="width: 64px; height: 64px; background: rgba(16, 185, 129, 0.14); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto var(--spacing-md); color: #10b981;">
                <i data-lucide="shield-check" style="width: 32px; height: 32px;"></i>
            </div>
            <h1 style="margin-bottom: 0.5rem; font-size: 1.8rem;">Verify Your Phone</h1>
            <p style="color: var(--color-text-muted);">Enter the 6-digit code sent to <strong>{{ phone }}</strong></p>
        </div>

        <form method="POST" action="{% url 'accounts:verify_phone_otp' %}" id="otp-form">
            {% csrf_token %}
            
            <div class="otp-inputs">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric">
            </div>
            
            <input type="hidden" name="otp" id="otp-hidden">
            
            <div class="timer" id="timer">
                Resend code in <span id="countdown">30</span> seconds
            </div>
            
            <button type="submit" id="verify-btn"
                    style="width: 100%; padding: 0.875rem; background: var(--color-primary); color: white; border: none; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; transition: transform 0.2s; margin-bottom: var(--spacing-md);"
                    onmouseover="this.style.transform='translateY(-1px)'"
                    onmouseout="this.style.transform='translateY(0)'">
                Verify Phone Number
            </button>
            
            <a href="{% url 'accounts:verify_phone' %}"
               style="display: block; width: 100%; padding: 0.875rem; background: var(--color-bg-card); color: var(--color-text-muted); border: 1px solid var(--color-border); border-radius: var(--radius-md); font-weight: 600; text-decoration: none; text-align: center;">
                Change Phone Number
            </a>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const otpInputs = document.querySelectorAll('.otp-input');
    const hiddenInput = document.getElementById('otp-hidden');
    const form = document.getElementById('otp-form');
    const timerElement = document.getElementById('timer');
    const countdownElement = document.getElementById('countdown');
    
    let countdown = 30;
    let timerInterval;
    
    // Auto-focus first input
    otpInputs[0].focus();
    
    // Handle OTP input navigation
    otpInputs.forEach((input, index) => {
        input.addEventListener('input', function(e) {
            // Only allow digits
            this.value = this.value.replace(/\D/g, '');
            
            // Auto-move to next input
            if (this.value && index < otpInputs.length - 1) {
                otpInputs[index + 1].focus();
            }
            
            // Update hidden input
            updateHiddenInput();
        });
        
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && !this.value && index > 0) {
                otpInputs[index - 1].focus();
            }
        });
        
        input.addEventListener('paste', function(e) {
            e.preventDefault();
            const paste = (e.clipboardData || window.clipboardData).getData('text');
            const digits = paste.replace(/\D/g, '').slice(0, 6);
            
            digits.split('').forEach((digit, i) => {
                if (otpInputs[index + i]) {
                    otpInputs[index + i].value = digit;
                }
            });
            
            // Focus last filled input or next empty one
            const nextIndex = Math.min(index + digits.length, otpInputs.length - 1);
            otpInputs[nextIndex].focus();
            updateHiddenInput();
        });
    });
    
    function updateHiddenInput() {
        const otp = Array.from(otpInputs).map(input => input.value).join('');
        hiddenInput.value = otp;
    }
    
    // Countdown timer
    function startTimer() {
        timerInterval = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(timerInterval);
                timerElement.style.display = 'none';
            }
        }, 1000);
    }
    
    startTimer();
});
</script>
{% endblock %}
