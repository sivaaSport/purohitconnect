<div id="support-widget" style="position: fixed; bottom: 30px; right: 30px; z-index: 9999; font-family: var(--font-body);">
    <!-- Chat Bubble Icon -->
    <button id="chat-toggle" style="width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, var(--color-primary-dark), var(--color-primary)); color: #111827; border: none; cursor: pointer; box-shadow: 0 12px 24px rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; transition: transform 0.3s;">
        <i data-lucide="message-square" id="icon-open"></i>
        <i data-lucide="x" id="icon-close" style="display: none;"></i>
    </button>

    <!-- Support Window -->
    <div id="support-window" style="display: none; position: absolute; bottom: 80px; right: 0; width: 350px; background: var(--color-bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--color-border); overflow: hidden; flex-direction: column;">
        <!-- Header -->
        <div style="background: linear-gradient(135deg, var(--color-secondary), var(--color-primary-dark)); color: #fff; padding: var(--spacing-md); display: flex; align-items: center; gap: 0.75rem;">
            <div style="width: 32px; height: 32px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <i data-lucide="flame" style="width: 18px; height: 18px;"></i>
            </div>
            <div>
                <div style="font-weight: 600; font-size: 0.95rem;">Support Center</div>
                <div style="font-size: 0.75rem; opacity: 0.8;">We typically reply in 10 mins</div>
            </div>
        </div>

        <!-- Content / Chat area -->
        <div id="support-content" style="padding: var(--spacing-md); max-height: 400px; overflow-y: auto; background: rgba(2, 6, 23, 0.35);">
            <div style="display: flex; gap: 0.5rem; margin-bottom: var(--spacing-md);">
                <div style="width: 28px; height: 28px; border-radius: 50%; background: var(--color-bg-main); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    <i data-lucide="bot" style="width: 14px; height: 14px; color: var(--color-primary);"></i>
                </div>
                <div style="background: rgba(148, 163, 184, 0.15); color: var(--color-text-main); padding: 0.75rem; border-radius: 0 12px 12px 12px; font-size: 0.9rem; line-height: 1.4;">
                    Namaste! 🙏 How can we help you today? You can raise a service request below and our admins will get back to you.
                </div>
            </div>

            <!-- Ticket Form -->
            <form id="ticket-form" hx-post="{% url 'core:create_ticket' %}" hx-target="#support-content" hx-swap="innerHTML">
                {% csrf_token %}
                <div style="margin-bottom: 0.75rem;">
                    <select name="category" style="width: 100%; padding: 0.6rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 0.85rem;">
                        <option value="general">General Inquiry</option>
                        <option value="booking">Booking Issue</option>
                        <option value="payment">Payment Issue</option>
                        <option value="technical">Technical Glitch</option>
                    </select>
                </div>
                <div style="margin-bottom: 0.75rem;">
                    <input type="text" name="subject" required placeholder="Subject / Summary" style="width: 100%; padding: 0.6rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 0.85rem;">
                </div>
                <div style="margin-bottom: var(--spacing-md);">
                    <textarea name="description" required placeholder="Describe your issue..." rows="3" style="width: 100%; padding: 0.6rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-size: 0.85rem; font-family: inherit; resize: none;"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.6rem; font-size: 0.9rem;">Send Request</button>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const toggle = document.getElementById('chat-toggle');
        const window = document.getElementById('support-window');
        const openIcon = document.getElementById('icon-open');
        const closeIcon = document.getElementById('icon-close');

        toggle.addEventListener('click', () => {
            const isHidden = window.style.display === 'none';
            window.style.display = isHidden ? 'flex' : 'none';
            openIcon.style.display = isHidden ? 'none' : 'block';
            closeIcon.style.display = isHidden ? 'block' : 'none';
            toggle.style.transform = isHidden ? 'rotate(90deg)' : 'rotate(0deg)';
        });
    });
</script>
