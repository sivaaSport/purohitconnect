{% for msg in chat_messages %}
    <div data-sender="{{ msg.sender.id }}" style="display: flex; flex-direction: column; {% if msg.sender == user %}align-items: flex-end;{% else %}align-items: flex-start;{% endif %};">
        
        <!-- Bubble -->
        <div style="max-width: 85%; padding: 12px 16px; border-radius: 18px; position: relative; font-size: 0.95rem; line-height: 1.5;
             {% if msg.sender == user %}
                background: linear-gradient(135deg, var(--color-primary), var(--color-secondary)); 
                color: white; 
                border-bottom-right-radius: 4px;
                box-shadow: 0 4px 12px rgba(249, 115, 22, 0.2);
             {% else %}
                background: var(--color-bg-card); 
                color: var(--color-text-main); 
                border-bottom-left-radius: 4px;
                border: 1px solid var(--color-border);
                box-shadow: var(--shadow-sm);
             {% endif %}">
            {{ msg.message }}
        </div>
        
        <!-- Metadata -->
        <div style="font-size: 0.7rem; color: var(--color-text-muted); margin-top: 4px; display: flex; align-items: center; gap: 4px; margin-left: 4px; margin-right: 4px;">
            <span>{{ msg.created_at|time:"H:i" }}</span>
            {% if msg.sender == user %}
                <i data-lucide="check-check" style="width: 12px; height: 12px; color: var(--color-primary);"></i>
            {% endif %}
        </div>
    </div>
{% endfor %}
