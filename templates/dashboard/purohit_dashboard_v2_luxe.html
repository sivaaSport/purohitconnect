{% extends 'dashboard/purohit_dashboard.html' %}
{% block title %}Purohit Dashboard | Luxe{% endblock %}

{% block extra_head %}
{{ block.super }}
<style>
    .card {
        border-radius: 18px !important;
        padding: 1.25rem 1.3rem !important;
    }
    .status-pill {
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        border-radius: 999px !important;
        font-weight: 800 !important;
    }
    .variant-shell {
        max-width: 1360px;
        margin: 1rem auto 2rem;
        padding: 1.25rem 1.1rem 0.4rem;
        border-radius: 24px;
    }
    .variant-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        font-size: 0.72rem;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        font-weight: 800;
        border-radius: 999px;
        padding: 0.38rem 0.75rem;
        margin: 0.2rem 0 0.8rem;
    }
    .variant-shell .container {
        width: 100% !important;
        max-width: none !important;
        padding: 0 0.6rem !important;
    }
    .variant-shell .ph-hero h1 { color: inherit; }
    .variant-shell .dashboard-grid {
        gap: 1.75rem !important;
    }
    .variant-shell .btn-primary {
        background: linear-gradient(135deg, #f59e0b, #facc15) !important;
        color: #111827 !important;
        border: none !important;
        font-weight: 800 !important;
    }

    [data-theme="dark"] body {
        background:
            radial-gradient(circle at 15% -10%, rgba(250, 204, 21, 0.15), transparent 45%),
            radial-gradient(circle at 85% 0%, rgba(217, 70, 239, 0.14), transparent 30%),
            linear-gradient(180deg, #0b1120, #0f172a 45%, #111827) !important;
        color: #e5e7eb;
    }
    [data-theme="dark"] .card {
        background: rgba(15, 23, 42, 0.78) !important;
        border: 1px solid rgba(250, 204, 21, 0.2) !important;
        box-shadow: 0 24px 56px rgba(0, 0, 0, 0.45) !important;
    }
    [data-theme="dark"] .btn-outline {
        border-color: rgba(250, 204, 21, 0.5) !important;
        color: #facc15 !important;
    }
    [data-theme="dark"] input,
    [data-theme="dark"] textarea,
    [data-theme="dark"] select {
        background: rgba(15, 23, 42, 0.92);
        color: #f9fafb;
    }
    [data-theme="dark"] .variant-shell {
        border: 1px solid rgba(250, 204, 21, 0.35);
        background: linear-gradient(135deg, rgba(2, 6, 23, 0.55), rgba(15, 23, 42, 0.82));
        box-shadow: 0 28px 60px rgba(0, 0, 0, 0.45);
    }
    [data-theme="dark"] .variant-pill {
        color: #facc15;
        background: rgba(250, 204, 21, 0.12);
        border: 1px solid rgba(250, 204, 21, 0.35);
    }
    [data-theme="dark"] .variant-shell .ph-hero h1 {
        color: #fde68a !important;
    }
    [data-theme="dark"] .variant-shell .ph-chapter-head h2,
    [data-theme="dark"] .variant-shell .ph-calendar h2 {
        color: #fde68a !important;
    }
    [data-theme="dark"] .variant-shell .btn-outline:hover {
        background: rgba(250, 204, 21, 0.1) !important;
    }
    [data-theme="dark"] .variant-shell .pc-offer,
    [data-theme="dark"] .variant-shell .ph-book,
    [data-theme="dark"] .variant-shell .ph-request,
    [data-theme="dark"] .variant-shell .ph-policy,
    [data-theme="dark"] .variant-shell .ph-add-form,
    [data-theme="dark"] .variant-shell .ph-empty,
    [data-theme="dark"] .variant-shell .ph-live,
    [data-theme="dark"] .variant-shell .ph-table-row {
        background: rgba(15, 23, 42, 0.78) !important;
        border: 1px solid rgba(250, 204, 21, 0.2) !important;
        box-shadow: 0 24px 56px rgba(0, 0, 0, 0.45) !important;
    }
    [data-theme="dark"] .variant-shell .pc-offer-add {
        background: rgba(2, 6, 23, 0.35) !important;
        border-style: dashed !important;
    }
    [data-theme="dark"] .variant-shell .pc-field-control,
    [data-theme="dark"] .variant-shell .pc-field select,
    [data-theme="dark"] .variant-shell .pc-field textarea {
        background: rgba(15, 23, 42, 0.92) !important;
        color: #f9fafb !important;
    }
    [data-theme="dark"] .variant-shell [x-show="timelineOpen"] > div:last-child {
        background: linear-gradient(180deg, #0b1120, #111827) !important;
        border-left: 1px solid rgba(250, 204, 21, 0.3) !important;
    }

    [data-theme="light"] body {
        background:
            radial-gradient(circle at 15% -10%, rgba(217, 119, 6, 0.14), transparent 45%),
            radial-gradient(circle at 85% 0%, rgba(245, 158, 11, 0.08), transparent 30%),
            linear-gradient(180deg, #FFF7ED, #F8FAFC 42%, #F1F5F9) !important;
        color: var(--color-text-main) !important;
    }
    [data-theme="light"] .card {
        background: #ffffff !important;
        border: 1px solid rgba(15, 23, 42, 0.1) !important;
        box-shadow: 0 16px 36px rgba(15, 23, 42, 0.08) !important;
        color: var(--color-text-main);
    }
    [data-theme="light"] .btn-outline {
        border-color: rgba(180, 83, 9, 0.35) !important;
        color: #9a3412 !important;
    }
    [data-theme="light"] input,
    [data-theme="light"] textarea,
    [data-theme="light"] select {
        background: #ffffff !important;
        color: #0f172a !important;
        border-color: rgba(15, 23, 42, 0.12);
    }
    [data-theme="light"] .variant-shell {
        border: 1px solid rgba(180, 83, 9, 0.16);
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    }
    [data-theme="light"] .variant-pill {
        color: #9a3412;
        background: rgba(245, 158, 11, 0.12);
        border: 1px solid rgba(180, 83, 9, 0.2);
    }
    [data-theme="light"] .variant-shell .ph-hero h1 {
        color: #9a3412 !important;
    }
    [data-theme="light"] .variant-shell .ph-chapter-head h2,
    [data-theme="light"] .variant-shell .ph-calendar h2 {
        color: #9a3412 !important;
    }
    [data-theme="light"] .variant-shell .btn-outline:hover {
        background: rgba(245, 158, 11, 0.1) !important;
    }
    [data-theme="light"] .variant-shell .pc-offer,
    [data-theme="light"] .variant-shell .ph-book,
    [data-theme="light"] .variant-shell .ph-request,
    [data-theme="light"] .variant-shell .ph-policy,
    [data-theme="light"] .variant-shell .ph-add-form,
    [data-theme="light"] .variant-shell .ph-empty,
    [data-theme="light"] .variant-shell .ph-live,
    [data-theme="light"] .variant-shell .ph-table-row {
        background: #ffffff !important;
        border: 1px solid rgba(15, 23, 42, 0.1) !important;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06) !important;
        color: #0f172a;
    }
    [data-theme="light"] .variant-shell .pc-offer-add {
        background: #fffbeb !important;
        border-style: dashed !important;
        border-color: rgba(180, 83, 9, 0.28) !important;
    }
    [data-theme="light"] .variant-shell .pc-field-control,
    [data-theme="light"] .variant-shell .pc-field select,
    [data-theme="light"] .variant-shell .pc-field textarea {
        background: #ffffff !important;
        color: #0f172a !important;
        border-color: rgba(15, 23, 42, 0.12);
    }
    [data-theme="light"] .variant-shell [x-show="timelineOpen"] > div:last-child {
        background: #ffffff !important;
        border-left: 1px solid rgba(15, 23, 42, 0.1) !important;
        color: #0f172a !important;
    }
    [data-theme="light"] .pc-cal-day.status-full {
        color: #b91c1c;
    }
</style>
{% endblock %}

{% block content %}
<div class="variant-shell">
    {{ block.super }}
</div>
{% endblock %}
