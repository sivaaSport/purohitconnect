{% extends 'base.html' %}

{% block title %}Write a Review | PurohitConnect{% endblock %}

{% block extra_head %}
<style>
    .review-shell .card {
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.9), rgba(17, 24, 39, 0.84));
    }
</style>
{% endblock %}

{% block content %}
<div class="container review-shell" style="padding: var(--spacing-xl) var(--spacing-md); max-width: 600px;">
    
    <div style="margin-bottom: var(--spacing-xl); text-align: center;">
        <h1 style="margin-bottom: 0.5rem;">Rate Your Experience</h1>
        <p style="color: var(--color-text-muted);">How was your {{ booking.puja_package.puja.name }} with {{ booking.purohit.name }}?</p>
    </div>

    <div class="card">
        <form method="POST">
            {% csrf_token %}
            
            <div style="text-align: center; margin-bottom: var(--spacing-xl);">
                <label style="display: block; font-weight: 500; margin-bottom: var(--spacing-sm);">Overall Rating *</label>
                <div style="display: flex; justify-content: center; gap: 0.5rem; font-size: 2rem; color: var(--color-border); cursor: pointer;" id="star-rating">
                    <i data-lucide="star" data-value="1"></i>
                    <i data-lucide="star" data-value="2"></i>
                    <i data-lucide="star" data-value="3"></i>
                    <i data-lucide="star" data-value="4"></i>
                    <i data-lucide="star" data-value="5"></i>
                </div>
                <input type="hidden" name="rating" id="rating-input" value="5" required>
            </div>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--spacing-md); margin-bottom: var(--spacing-xl); background: var(--color-bg-main); padding: var(--spacing-md); border-radius: var(--radius-md);">
                <div>
                    <label style="display: block; font-size: 0.9rem; margin-bottom: 0.25rem;">Punctuality (1-5)</label>
                    <input type="number" name="punctuality_rating" min="1" max="5" value="5" style="width: 100%; padding: 0.5rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm);">
                </div>
                <div>
                    <label style="display: block; font-size: 0.9rem; margin-bottom: 0.25rem;">Knowledge (1-5)</label>
                    <input type="number" name="knowledge_rating" min="1" max="5" value="5" style="width: 100%; padding: 0.5rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm);">
                </div>
                <div>
                    <label style="display: block; font-size: 0.9rem; margin-bottom: 0.25rem;">Communication (1-5)</label>
                    <input type="number" name="communication_rating" min="1" max="5" value="5" style="width: 100%; padding: 0.5rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm);">
                </div>
            </div>
            
            <div style="margin-bottom: var(--spacing-md);">
                <label style="display: block; font-weight: 500; margin-bottom: var(--spacing-sm);">Review Title *</label>
                <input type="text" name="title" required placeholder="Summarize your experience" style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-family: var(--font-body);">
            </div>
            
            <div style="margin-bottom: var(--spacing-lg);">
                <label style="display: block; font-weight: 500; margin-bottom: var(--spacing-sm);">Your Review *</label>
                <textarea name="comment" required rows="4" placeholder="Tell us more about the puja, the purohit's chanting, and your overall satisfaction." style="width: 100%; padding: 0.75rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); font-family: var(--font-body);"></textarea>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Review</button>
        </form>
    </div>
</div>

<script>
    // Simple star rating interaction
    document.addEventListener('DOMContentLoaded', function() {
        const stars = document.querySelectorAll('#star-rating i');
        const input = document.getElementById('rating-input');
        
        // Init with 5 stars
        updateStars(5);
        
        stars.forEach(star => {
            star.addEventListener('click', function() {
                const val = this.getAttribute('data-value');
                input.value = val;
                updateStars(val);
            });
        });
        
        function updateStars(val) {
            stars.forEach(s => {
                const sVal = s.getAttribute('data-value');
                if (sVal <= val) {
                    s.style.color = 'var(--color-accent)';
                    s.style.fill = 'var(--color-accent)';
                } else {
                    s.style.color = 'var(--color-border)';
                    s.style.fill = 'none';
                }
            });
        }
    });
</script>
{% endblock %}
